<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price Check — new look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens. Lamar's blue kept; surfaces now SOLID per directive 2.1 ───── */
:root{
  color-scheme:dark;
  --bg:#0B0D12;
  --surface:#171A21;        /* solid. no backdrop-filter anywhere */
  --surface-2:#0F1116;
  --line:#2A2F3A;
  --ink:#FFFFFF;            /* 17:1 on surface */
  --ink-2:rgba(255,255,255,.84);
  --ink-3:rgba(255,255,255,.70);
  --accent:#3B82F6;
  --accent-ink:#A9CEFF;
  --ok:#3FD69B; --warn:#FFA53D; --bad:#FF5A70;
  --r:16px; --r-s:12px;
  --raise:inset 0 1px 0 rgba(255,255,255,.07),0 4px 10px -6px rgba(0,0,0,.8);
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding:16px 16px calc(84px + env(safe-area-inset-bottom));}
/* The effects layer: behind everything, never under text without a panel */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

h1{font:700 17px/1.2 var(--sans);margin:4px 0 14px;letter-spacing:-.01em}
.label{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ── Cards: solid, 1px line, short shadow, animate in ──────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--raise);padding:16px;margin-bottom:12px}
.rise{opacity:0;transform:translateY(14px);animation:rise .32s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.rise:nth-of-type(1){animation-delay:.00s}.rise:nth-of-type(2){animation-delay:.05s}
.rise:nth-of-type(3){animation-delay:.10s}.rise:nth-of-type(4){animation-delay:.15s}
.rise:nth-of-type(5){animation-delay:.20s}.rise:nth-of-type(6){animation-delay:.25s}

/* ── The one thing: what to pay ────────────────────────────────────────── */
.hero{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent)}
.hero .who{font:500 14px/1.2 var(--sans);color:var(--ink-3)}
.hero .what{font:700 20px/1.25 var(--sans);margin:4px 0 12px;letter-spacing:-.01em}
.hero .big{font:700 clamp(46px,15vw,60px)/.95 var(--sans);letter-spacing:-.03em}
.hero .sub{font:500 16px/1.4 var(--sans);color:var(--ink-2);margin-top:8px}
.hero .sub b{color:var(--ink);font-weight:700}

.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.act{min-height:64px;min-width:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-s);color:var(--ink-2);font:600 13px/1 var(--sans);cursor:pointer;
  transition:transform .15s,background .15s,border-color .15s}
.act:hover{background:#151821;border-color:#3A4150}
.act:active{transform:translateY(1px)}
.act svg{width:20px;height:20px;stroke-width:2}
.act[disabled]{opacity:.42;cursor:default}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Asking price ──────────────────────────────────────────────────────── */
.ask{display:flex;align-items:center;gap:10px;margin-top:10px}
.ask span{font:700 22px/1 var(--mono);color:var(--ink-3)}
.ask input{flex:1;min-width:0;min-height:52px;font:700 20px/1 var(--mono);color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:0 14px}
.ask input::placeholder{color:var(--ink-3);font-weight:500;font-size:16px}
.ask input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── Condition ─────────────────────────────────────────────────────────── */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;
  background:none;border:0;color:var(--bad);font:600 13px/1 var(--sans);cursor:pointer}
.kill svg{width:16px;height:16px}
.pills{display:flex;gap:6px;padding:4px;margin-top:10px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px}
.pills button{flex:1;min-height:44px;padding:0 6px;border:0;border-radius:999px;background:transparent;
  color:var(--ink-2);font:600 15px/1 var(--sans);cursor:pointer;transition:background .15s,color .15s}
.pills button[aria-pressed="true"]{background:var(--accent);color:#fff}
.pills button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Rows ──────────────────────────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.row>i{flex:0 0 40px;height:40px;display:grid;place-items:center;background:var(--surface-2);
  border:1px solid var(--line);border-radius:11px;color:var(--accent-ink)}
.row>i svg{width:19px;height:19px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:700 16px/1.3 var(--sans)}
.row .t span{display:block;font:400 14px/1.4 var(--sans);color:var(--ink-2);margin-top:2px}
.row .v{font:700 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--warn)}

/* ── Bottom bar ────────────────────────────────────────────────────────── */
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:none;border:0;color:var(--ink-3);font:600 13px/1 var(--sans);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent-ink)}
.tabs svg{width:20px;height:20px}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}
  .act,.pills button{transition:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<h1>The Pawn Desk</h1>

<section class="card hero rise">
  <div class="who">On the counter</div>
  <div class="what">Ruger LCP · Excellent</div>
  <div class="label">Pay up to</div>
  <div class="big num">$90</div>
  <div class="sub">Resells <b class="num">$179</b> · you make <b class="num">$89</b></div>
  <div class="acts">
    <button class="act"><i data-lucide="search"></i>Look up</button>
    <button class="act"><i data-lucide="file-text"></i>Log it</button>
    <button class="act"><i data-lucide="plus"></i>Another</button>
    <button class="act"><i data-lucide="menu"></i>Detail</button>
  </div>
</section>

<section class="card rise">
  <div class="label">What are they asking?</div>
  <div class="ask"><span>$</span><input type="number" inputmode="decimal" placeholder="Their price" aria-label="What are they asking"></div>
</section>

<section class="card rise">
  <div class="head">
    <div class="label">Shape it is in</div>
    <button class="kill"><i data-lucide="triangle-alert"></i>What kills it</button>
  </div>
  <div class="pills" role="group" aria-label="Condition">
    <button>New</button><button aria-pressed="true">Excellent</button>
    <button>Good</button><button>Fair</button><button>Rough</button>
  </div>
</section>

<div class="label" style="margin:18px 2px 10px">Behind this number</div>

<div class="row rise">
  <i><i data-lucide="trending-up"></i></i>
  <div class="t"><b>Real sales</b>
    <span><span class="num">$170–$230</span> read off GunWatcher on Sep 19 — not counted</span>
    <div class="bar"><i style="width:52%"></i></div></div>
</div>

<div class="row rise">
  <i><i data-lucide="clock"></i></i>
  <div class="t"><b>Lend him</b><span>60-day pawn · fee <span class="num">$20</span> · your cushion <span class="num">$99</span></span></div>
  <div class="v">$80</div>
</div>

<nav class="tabs">
  <button aria-current="page"><i data-lucide="tag"></i>Price</button>
  <button><i data-lucide="gem"></i>Gold</button>
  <button><i data-lucide="settings"></i>Setup</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/lucide@1/dist/umd/lucide.min.js"></script>
<script>
if (window.lucide) lucide.createIcons();

/* The modern layer for a Work tool (directive 6.0): a slow, low-contrast
   particle field behind solid panels. Plain canvas, about 2KB, no three.js:
   6.2 puts three.js on Showpiece and real 3D jobs, and this app has to work
   offline off a cached copy. Text never sits on it without a solid card. */
(function(){
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N=innerWidth<700?34:80;           /* ~40% on phones, per 6.3 */
  let w=0,h=0,dots=[];
  function size(){
    const dpr=Math.min(devicePixelRatio,2);   /* capped, per 6.3 */
    w=innerWidth; h=innerHeight;
    cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dots=Array.from({length:N},()=>({x:Math.random()*w,y:Math.random()*h,
      r:.6+Math.random()*1.6,s:.04+Math.random()*.10,a:.05+Math.random()*.16}));
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(const d of dots){
      d.y-=d.s; if(d.y<-4){d.y=h+4; d.x=Math.random()*w;}
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.283);
      ctx.fillStyle='rgba(169,206,255,'+d.a+')'; ctx.fill();
    }
    if(!document.hidden) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize',size);
  if(calm){ frame.call(null); ctx.clearRect(0,0,w,h);
    for(const d of dots){ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.283);
      ctx.fillStyle='rgba(169,206,255,'+d.a+')';ctx.fill();} }   /* still frame */
  else { requestAnimationFrame(frame);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestAnimationFrame(frame)}); }
})();

/* Motion on the controls (6.0 Work tool): the condition pills answer instantly. */
document.querySelectorAll('.pills button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.pills button').forEach(o=>o.removeAttribute('aria-pressed'));
  b.setAttribute('aria-pressed','true');
});
</script>
</body>
</html>
